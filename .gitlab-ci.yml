stages:
  - install
  - test
  - publish
  - release  # Stage to create the release

variables:
  NODE_ENV: 'test'
  NODE_VERSION: '18'
  NPM_TOKEN: $CI_JOB_TOKEN
  NPM_REGISTRY_URL: "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/packages/npm/"

cache:
  paths:
    - node_modules/

before_script:
  - 'which node'
  - node --version
  - npm --version

install_dependencies:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

test:
  stage: test
  image: node:${NODE_VERSION}
  dependencies:
    - install_dependencies
  script:
    - npm test

publish:
  stage: publish
  image: node:${NODE_VERSION}
  only:
    - tags
  script:
    - echo "//gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm publish --registry ${NPM_REGISTRY_URL}
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

release:
  stage: release
  image: node:${NODE_VERSION}  # Using Node.js image
  script:
    - echo "Publishing CI/CD component to the catalog..."
  release:
    name: "Release v${CI_COMMIT_TAG}"
    tag_name: "${CI_COMMIT_TAG}"
    description: "Release of version ${CI_COMMIT_TAG}"
    ref: "${CI_COMMIT_REF_NAME}"
    milestones: ["v${CI_COMMIT_TAG}"]
    assets:
      links:
        - name: "Component Source"
          url: "https://gitlab.com/${CI_PROJECT_PATH}/-/archive/${CI_COMMIT_TAG}/${CI_PROJECT_NAME}-${CI_COMMIT_TAG}.tar.gz"
  only:
    - tags
