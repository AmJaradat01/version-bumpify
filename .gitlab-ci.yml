stages:
  - install
  - test

variables:
  NODE_ENV: 'test'
  NODE_VERSION: '18'  # Adjust to match your Node.js version

cache:
  paths:
    - node_modules/

before_script:
  - 'which node'
  - node --version
  - npm --version

install_dependencies:
  stage: install
  image: node:${NODE_VERSION}
  script:
    - npm install
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

test:
  stage: test
  image: node:${NODE_VERSION}
  dependencies:
    - install_dependencies
  script:
    - npm test
